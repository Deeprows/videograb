name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default `packages` is "tools platform-tools". The legacy
      # "tools" package no longer exists in Google's repository, so sdkmanager
      # exits 1 ("Failed to find package 'tools'"). Install exactly what the
      # build needs instead (compileSdk = 34 in app/build.gradle.kts).
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGrab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
